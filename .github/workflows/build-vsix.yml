name: build-vsix

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle the bridge plugin
        run: npm ci && npm run bundle:bridge

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Type-check and bundle
        working-directory: extension
        run: npx tsc -p tsconfig.json --noEmit && node esbuild.mjs

      - name: Package VSIX
        working-directory: extension
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-vscode-panel-vsix
          path: extension/*.vsix

      - name: Attach the VSIX to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: extension/*.vsix
          generate_release_notes: true
